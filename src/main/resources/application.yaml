server:
  port: 8080

spring:
  application:
    name: spring-ai-mcp-client
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5
          temperature: 1
    mcp:
      client:
        toolcallback:
          enabled: true
        streamable-http:
          connections:
            tavily-server:
              url: "https://mcp.tavily.com"
              endpoint: "/mcp/?tavilyApiKey=${TAVILY_API_KEY}"
logging:
  level:
    io.modelcontextprotocol: DEBUG
    org.springframework.ai.mcp: DEBUG
    org.springframework.ai.tool: DEBUG
    org.springframework.ai.chat: DEBUG